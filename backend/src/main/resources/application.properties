spring.application.name=runforge-backend
server.port=8080

# Load local secrets from backend/.env (works whether started from backend/ or the repo root).
# Real environment variables still take precedence.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Supabase (PostgreSQL) connection
# Provide these via environment variables (see backend/.env.example).
# SUPABASE_DB_URL example: jdbc:postgresql://db.<project-ref>.supabase.co:5432/RunForgeDb
# For the Supabase connection pooler use port 6543 instead of 5432.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/RunForgeDb}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
server.servlet.context-path=/api

spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true


# H2 console disabled - no longer used (Supabase/PostgreSQL is now the datastore)
spring.h2.console.enabled=false

# Seed data only runs when explicitly enabled (avoids duplicate-key errors on
# an already-populated Supabase database). Set to "always" for a fresh DB.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
